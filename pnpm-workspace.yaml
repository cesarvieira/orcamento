packages:
  - 'api'
  - 'web'
  - 'packages/*'
allowBuilds:
  # Binários nativos que dependências reais precisam para funcionar — watcher
  # de arquivo do Vite/Nuxt e o compilador do esbuild. Sem rodar o postinstall,
  # o build falha ou produz artefato incompleto.
  '@parcel/watcher': true
  # O binário que SOBE SOURCE MAP para a instância do Sentry. Ligado de
  # propósito desde a D-09: stack trace minificado do front era diagnóstico
  # pela metade, e a #114 existiu justamente para não ter diagnóstico pela
  # metade. Todo `pnpm install` deste monorepo — inclusive o de cada
  # worktree que o condutor abre — baixa este binário (~20 MB) de um CDN
  # externo, e este é o custo pago em troca do stack trace legível.
  #
  # O UPLOAD em si continua opt-in: só acontece quando SENTRY_AUTH_TOKEN
  # existe no build (ver .preator/playbooks/sentry.md). Este flag só decide
  # se o binário É BAIXADO — sem token, o plugin do Sentry pula o upload e
  # segue, mesmo com o binário presente.
  '@sentry/cli': true
  esbuild: true
  # Transitiva de `svgtofont`, dentro de `@tabler/icons-webfont` — só é usada
  # se ELE regenerar fontes a partir de SVG. Consumimos o `dist/` já
  # pré-compilado do pacote, então nunca chamamos essa etapa; e o binário não
  # compila nesta máquina (exige Visual Studio C++ que não está instalado).
  # Falso: barato de reverter se algum dia precisarmos regenerar ícones aqui.
  ttf2woff2: false
patchedDependencies:
  vite-plugin-vue-tracer@1.5.0: patches/vite-plugin-vue-tracer@1.5.0.patch
overrides:
  '@esbuild-kit/core-utils>esbuild': '0.25.12'
